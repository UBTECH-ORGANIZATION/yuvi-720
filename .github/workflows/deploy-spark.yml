name: Build, Deploy Dev & Promote to Production (spark / yuvi-720)

on:
  push:
    branches: [main]
    paths-ignore:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
      # The game-gen worker has its own pipeline; a worker-only commit must
      # not rebuild and redeploy the whole Spark image.
      - "workers/**"
      - "infra/game-gen/**"
      - ".github/workflows/deploy-game-gen.yml"
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote Dev → Production after deploy? (main only)"
        required: true
        type: boolean
        default: false

# A branch dispatch is a Dev-slot preview; say so in the run list. An empty
# run-name falls back to the workflow name.
run-name: "${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('Dev preview of {0}', github.ref_name) || '' }}"

permissions:
  contents: read

# One deploy at a time: two runs interleaving a Dev deploy with a swap would
# ship an unintended image to production.
concurrency:
  group: spark-dev-slot
  cancel-in-progress: false

env:
  ACR_NAME: yuvi720acr
  ACR_LOGIN_SERVER: yuvi720acr.azurecr.io
  IMAGE_NAME: yuvi-720
  RESOURCE_GROUP: rg-yuvi-720
  WEBAPP_NAME: ubi-yuvi-720
  SLOT_NAME: dev

jobs:
  # ── Job 0: Tests — nothing below runs if these fail ───────────
  tests:
    uses: ./.github/workflows/ci.yml

  # ── Job 1: Build & Push Docker image ──────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # `latest` means "what main last built". A branch preview must not
      # overwrite it — deploy-production-ref.yml relies on that tag staying
      # trustworthy.
      - name: Tag latest (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  # ── Job 2: Deploy to Dev slot (always runs) ───────────────────
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://dev.spark.yuvilab.ai
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Dev slot routing
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --slot-settings \
              FRONTEND_URL=https://dev.spark.yuvilab.ai \
              PUBLIC_APP_URL=https://dev.spark.yuvilab.ai \
              WEBSITES_PORT=8000 \
              LLM_STRONG_DEPLOYMENT_NAME=gpt-5.4 \
              LLM_MINI_DEPLOYMENT_NAME=gpt-5.4-mini \
              COACH_TOOL_CALLING_ENABLED=true \
              COACH_DEBUG_TRACE_ENABLED=false \
              SPARK_ENVIRONMENT=dev \
              PASSWORD_LOGIN_ENABLED=true \
              MOE_OIDC_ENABLED=true \
              MOE_OIDC_ISSUER=https://is.remote.education.gov.il/nidp/oauth/nam \
              MOE_OIDC_REDIRECT_PATH=/api/auth/moe/callback \
              MOE_OIDC_REDIRECT_URI=https://dev.spark.yuvilab.ai \
              MOE_OIDC_SCOPES="openid profileEXT eduorg edustudent" \
              MOE_OIDC_TOKEN_AUTH_METHOD=client_secret_basic \
              MOE_OIDC_POST_LOGOUT_URL=https://dev.spark.yuvilab.ai \
            --output none

      - name: Refuse to deploy Dev against the production database
        run: |
          # Work item 248. MONGODB_CONNECTION_STRING is a slot setting, so this
          # cannot drift through a swap — but it can be edited by hand, and the
          # damage would be silent. Check the host, never print the string.
          dev_connection="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --query "[?name=='MONGODB_CONNECTION_STRING'].value | [0]" \
            --output tsv)"
          dev_host="$(sed -E 's|.*@([^/?,]+).*|\1|' <<< "$dev_connection")"
          echo "Dev slot database host: $dev_host"
          case "$dev_host" in
            yuvi720.mongocluster.cosmos.azure.com|yuvi720.global.mongocluster.cosmos.azure.com)
              echo "The Dev slot is pointed at the production cluster. Point it at yuvi720-dev."
              exit 1
              ;;
          esac

      - name: Refuse to deploy Dev against the production cache
        run: |
          # Same contract as the database: REDIS_CONNECTION_STRING is a slot
          # setting, so it cannot drift through a swap, but a hand edit would
          # be silent. Check the host, never print the string.
          dev_cache="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --query "[?name=='REDIS_CONNECTION_STRING'].value | [0]" \
            --output tsv)"
          dev_cache_host="$(sed -E 's|.*@([^/?,:]+).*|\1|' <<< "$dev_cache")"
          echo "Dev slot cache host: ${dev_cache_host:-none}"
          case "$dev_cache_host" in
            redis-yuvi-720.*)
              echo "The Dev slot is pointed at the production cache. Point it at redis-yuvi-720-dev."
              exit 1
              ;;
          esac

      - name: Stamp the release on the Dev slot
        run: |
          # Deliberately NOT a slot setting: it has to travel with the image
          # through the swap, or production reports the version it replaced.
          az webapp config appsettings set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --settings SPARK_RELEASE=${{ github.sha }} \
            --output none

      - name: Verify required Dev slot settings
        run: |
          configured_settings="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --output json | jq -r '.[] | select(.value != null and .value != "") | .name')"
          required_settings=(
            APIM_BASE_URL
            APIM_SUBSCRIPTION_KEY
            APIM_API_VERSION
            LLM_STRONG_DEPLOYMENT_NAME
            LLM_MINI_DEPLOYMENT_NAME
            MONGODB_CONNECTION_STRING
            FRONTEND_URL
            PUBLIC_APP_URL
            SECRET_KEY
            WEBSITES_PORT
            COACH_TOOL_CALLING_ENABLED
            COACH_DEBUG_TRACE_ENABLED
            LRS_ENABLED
            LRS_TOKEN_URL
            LRS_STATEMENTS_URL
            LRS_CLIENT_ID
            LRS_CLIENT_SECRET
            LRS_SUPPLIER_DOMAIN
            APPLICATIONINSIGHTS_CONNECTION_STRING
            SPARK_ENVIRONMENT
            REDIS_CONNECTION_STRING
            SPARK_CACHE
            MOE_OIDC_CLIENT_ID
            MOE_OIDC_CLIENT_SECRET
            MOE_LEARNER_ID_SALT
            GAME_JOBS_MODE
            GAME_JOBS_QUEUE
            GAME_JOBS_SERVICEBUS_NAMESPACE
            GAMES_STORAGE
            GAMES_STORAGE_ACCOUNT_URL
            GAMES_BLOB_CONTAINER
          )
          missing_settings=()
          for setting_name in "${required_settings[@]}"; do
            if ! grep -qx "$setting_name" <<< "$configured_settings"; then
              missing_settings+=("$setting_name")
            fi
          done
          if (( ${#missing_settings[@]} )); then
            printf 'Missing required Dev slot settings: %s\n' "${missing_settings[*]}"
            exit 1
          fi

          trace_enabled="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --query \"[?name=='COACH_DEBUG_TRACE_ENABLED'].value | [0]\" \
            --output tsv | tr '[:upper:]' '[:lower:]')"
          if [[ "$trace_enabled" == "1" || "$trace_enabled" == "true" || "$trace_enabled" == "yes" || "$trace_enabled" == "on" ]]; then
            echo "COACH_DEBUG_TRACE_ENABLED must remain disabled in the Dev slot"
            exit 1
          fi

      - name: Deploy to Dev slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: ${{ env.SLOT_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure logout
        run: az logout
        if: always()

  # ── Job 3: Swap Dev → Production (manual trigger, from main only) ─
  # The Dev slot may hold a branch preview; a swap must only ever carry a
  # build of main. The `if` keeps the job out of a branch run entirely, and
  # the first step is a loud second lock in case the condition is edited.
  promote-production:
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name == 'workflow_dispatch' && inputs.promote == true && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://spark.yuvilab.ai
    steps:
      - name: Refuse to promote anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Refusing to swap: promote was requested from ${{ github.ref_name }}, not main."
          exit 1

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify production Coach controls
        run: |
          production_flags="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --query \"[?name=='COACH_TOOL_CALLING_ENABLED' || name=='COACH_DEBUG_TRACE_ENABLED'].{name:name,value:value}\" \
            --output json)"
          tool_enabled="$(jq -r '.[] | select(.name == \"COACH_TOOL_CALLING_ENABLED\") | .value' <<< \"$production_flags\" | tr '[:upper:]' '[:lower:]')"
          trace_enabled="$(jq -r '.[] | select(.name == \"COACH_DEBUG_TRACE_ENABLED\") | .value' <<< \"$production_flags\" | tr '[:upper:]' '[:lower:]')"
          if [[ "$tool_enabled" != "true" || "$trace_enabled" == "1" || "$trace_enabled" == "true" || "$trace_enabled" == "yes" || "$trace_enabled" == "on" ]]; then
            echo "Production Coach flags must be COACH_TOOL_CALLING_ENABLED=true and COACH_DEBUG_TRACE_ENABLED=false"
            exit 1
          fi

      - name: Verify production has a working login path
        run: |
          # Password login is a developer-machine and Dev-slot affordance
          # (app.core.env.password_login_allowed; PASSWORD_LOGIN_ENABLED is a Dev
          # slot setting and the code refuses it in production regardless), so
          # Ministry of Education SSO is the ONLY door into production. Swapping
          # with it disabled would lock every user out silently. Fail loudly instead.
          # To unblock: set MOE_OIDC_ENABLED / MOE_OIDC_CLIENT_ID / MOE_OIDC_CLIENT_SECRET /
          # MOE_LEARNER_ID_SALT on the production slot once MoE issues prod credentials.
          production_login="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --output json | jq -r '[.[] | select(.name | startswith("MOE_")) | select(.value != null and .value != "")] | map(.name) | join(" ")')"
          moe_enabled="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --query "[?name=='MOE_OIDC_ENABLED'].value | [0]" \
            --output tsv | tr '[:upper:]' '[:lower:]')"
          if [[ "$moe_enabled" != "true" && "$moe_enabled" != "1" && "$moe_enabled" != "yes" && "$moe_enabled" != "on" ]]; then
            echo "MOE_OIDC_ENABLED is not true on the production slot."
            echo "Password login is local-only, so production would have no login path. Refusing to swap."
            exit 1
          fi
          for setting_name in MOE_OIDC_CLIENT_ID MOE_OIDC_CLIENT_SECRET MOE_LEARNER_ID_SALT; do
            if ! grep -qw "$setting_name" <<< "$production_login"; then
              echo "Missing production setting $setting_name; refusing to swap."
              exit 1
            fi
          done
          # Belt and braces: the code ignores it in production, but a hand-set
          # PASSWORD_LOGIN_ENABLED on the production slot means someone expects
          # it to work — say no before the swap rather than after.
          password_flag="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --query "[?name=='PASSWORD_LOGIN_ENABLED'].value | [0]" \
            --output tsv | tr '[:upper:]' '[:lower:]')"
          if [[ "$password_flag" == "1" || "$password_flag" == "true" || "$password_flag" == "yes" || "$password_flag" == "on" ]]; then
            echo "PASSWORD_LOGIN_ENABLED is set on the production slot. Production is Ministry SSO only; remove it."
            exit 1
          fi

      - name: Verify production still owns the production database
        run: |
          # Work item 248. A swap must not move a database: verify the
          # production slot keeps the production cluster and says so.
          production_connection="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --query "[?name=='MONGODB_CONNECTION_STRING'].value | [0]" \
            --output tsv)"
          production_host="$(sed -E 's|.*@([^/?,]+).*|\1|' <<< "$production_connection")"
          production_environment="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --query "[?name=='SPARK_ENVIRONMENT'].value | [0]" \
            --output tsv)"
          echo "Production database host: $production_host (environment $production_environment)"
          if [[ "$production_host" != "yuvi720.mongocluster.cosmos.azure.com" ]]; then
            echo "Production is not pointed at the production cluster; refusing to swap."
            exit 1
          fi
          if [[ "$production_environment" != "production" ]]; then
            echo "SPARK_ENVIRONMENT on the production slot must be 'production'."
            exit 1
          fi
          # And its cache: the swap must not move that either.
          production_cache="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --query "[?name=='REDIS_CONNECTION_STRING'].value | [0]" \
            --output tsv)"
          production_cache_host="$(sed -E 's|.*@([^/?,:]+).*|\1|' <<< "$production_cache")"
          echo "Production cache host: ${production_cache_host:-none}"
          if [[ "$production_cache_host" != redis-yuvi-720.* ]]; then
            echo "Production is not pointed at the production cache (redis-yuvi-720); refusing to swap."
            exit 1
          fi

      - name: Swap Dev slot → Production
        run: |
          echo "🔄 Swapping Dev → Production..."
          az webapp deployment slot swap \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --target-slot production
          echo "✅ Swap completed!"

      - name: Azure logout
        run: az logout
        if: always()
