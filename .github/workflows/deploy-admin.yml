name: Build and deploy Spark admin

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: yuvi720acr.azurecr.io
  IMAGE_NAME: yuvi-720-admin
  WEBAPP_NAME: ${{ vars.ADMIN_WEBAPP_NAME || 'ubi-admin-yuvi-720' }}

concurrency:
  group: spark-admin-production
  cancel-in-progress: false

jobs:
  # Same gate as the spark pipeline: admin tests, backend tests, frontend tests.
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push admin image
        run: |
          docker build --platform linux/amd64 \
            --file admin/Dockerfile \
            --tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            admin
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: admin
      url: ${{ vars.ADMIN_URL || 'https://ubi-admin-yuvi-720.azurewebsites.net' }}
    permissions:
      contents: read
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify administrator authentication settings
        run: |
          for setting in ADMIN_SECRET_KEY ADMIN_EMAILS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            value="$(az webapp config appsettings list \
              --resource-group rg-yuvi-720 \
              --name "${{ env.WEBAPP_NAME }}" \
              --query "[?name=='${setting}'].value | [0]" \
              --output tsv)"
            if [ -z "${value}" ]; then
              echo "Missing required App Service setting: ${setting}"
              exit 1
            fi
          done

      - name: Enforce Google administrator authentication
        run: |
          az webapp config appsettings set \
            --resource-group rg-yuvi-720 \
            --name "${{ env.WEBAPP_NAME }}" \
            --settings \
              ADMIN_ENV=production \
              ADMIN_PUBLIC_ACCESS=false \
              ADMIN_BASE_URL=https://admin.spark.yuvilab.ai \
              ADMIN_COOKIE_SECURE=true \
              WEBSITES_PORT=8000 \
            --output none

      - name: Deploy admin Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify production readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              "https://${{ env.WEBAPP_NAME }}.azurewebsites.net/health/ready"; then
              exit 0
            fi
            echo "Admin is not ready yet (attempt ${attempt}/20)"
            sleep 15
          done
          exit 1

      - name: Log out from Azure
        if: always()
        run: az logout
