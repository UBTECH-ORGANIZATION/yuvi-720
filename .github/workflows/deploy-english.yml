name: Build & Deploy English slot (en-720 / yuvi-720)

# The en-720 branch is the English-lomda line of the product and it ships to the
# dedicated `english` slot only. This workflow never touches Dev or Production
# and never tags `latest` — that tag belongs to the main-branch pipeline
# (deploy-spark.yml). Images follow the slot's existing `english-<sha>` naming.

on:
  push:
    branches: [en-720]
    paths-ignore:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

env:
  ACR_NAME: yuvi720acr
  ACR_LOGIN_SERVER: yuvi720acr.azurecr.io
  IMAGE_NAME: yuvi-720
  RESOURCE_GROUP: rg-yuvi-720
  WEBAPP_NAME: ubi-yuvi-720
  SLOT_NAME: english
  SLOT_URL: https://ubi-yuvi-720-english.azurewebsites.net

jobs:
  # ── Job 1: Build & Push Docker image ──────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:english-${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:english-${{ github.sha }}

  # ── Job 2: Deploy to the English slot ─────────────────────────
  deploy-english:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: english
      url: https://ubi-yuvi-720-english.azurewebsites.net
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure English slot routing
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --slot-settings \
              FRONTEND_URL=${{ env.SLOT_URL }} \
              PUBLIC_APP_URL=${{ env.SLOT_URL }} \
              WEBSITES_PORT=8000 \
              LLM_STRONG_DEPLOYMENT_NAME=gpt-5.4 \
              LLM_MINI_DEPLOYMENT_NAME=gpt-5.4-mini \
            --output none

      # The base list every slot needs, plus what the English line adds on top:
      # speech + realtime voice power dictation and voice calls. LRS_ECAT_ITEMS
      # stays optional — content-vendor identity resolves from the supplier map.
      - name: Verify required English slot settings
        run: |
          configured_settings="$(az webapp config appsettings list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --slot ${{ env.SLOT_NAME }} \
            --output json | jq -r '.[] | select(.value != null and .value != "") | .name')"
          required_settings=(
            APIM_BASE_URL
            APIM_SUBSCRIPTION_KEY
            APIM_API_VERSION
            LLM_STRONG_DEPLOYMENT_NAME
            LLM_MINI_DEPLOYMENT_NAME
            MONGODB_CONNECTION_STRING
            FRONTEND_URL
            PUBLIC_APP_URL
            SECRET_KEY
            WEBSITES_PORT
            LRS_ENABLED
            LRS_TOKEN_URL
            LRS_STATEMENTS_URL
            LRS_CLIENT_ID
            LRS_CLIENT_SECRET
            LRS_SUPPLIER_DOMAIN
            AZURE_SPEECH_KEY
            AZURE_SPEECH_REGION
            AZURE_OPENAI_REALTIME_ENDPOINT
            AZURE_OPENAI_REALTIME_KEY
            KATA_API_KEY
            KATA_BASE_URL
          )
          missing_settings=()
          for setting_name in "${required_settings[@]}"; do
            if ! grep -qx "$setting_name" <<< "$configured_settings"; then
              missing_settings+=("$setting_name")
            fi
          done
          if (( ${#missing_settings[@]} )); then
            printf 'Missing required English slot settings: %s\n' "${missing_settings[*]}"
            exit 1
          fi

      - name: Deploy to English slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: ${{ env.SLOT_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:english-${{ github.sha }}

      - name: Smoke check the landing page
        run: |
          for attempt in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' ${{ env.SLOT_URL }}/landing || true)"
            if [[ "$code" == "200" ]]; then
              echo "✅ ${{ env.SLOT_URL }}/landing responded 200"
              exit 0
            fi
            echo "attempt $attempt: got $code, retrying..."
            sleep 15
          done
          echo "❌ /landing never returned 200 after the deploy"
          exit 1

      - name: Azure logout
        run: az logout
        if: always()
