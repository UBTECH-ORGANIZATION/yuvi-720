# Nightly content intelligence: keep content/context/ in step with the live
# Kata catalog. Fetch → fingerprint diff → browse changed lomdot → regenerate
# stale texts → open a pull request. A quiet catalog opens nothing.
#
# A PR, not a push: `main` only accepts pull requests with the three CI checks
# green (repository rule), so a direct push from here is rejected. The change
# lands on a rolling `content/nightly` branch; the PR is created once and then
# updated in place on later nights until someone merges it. Merging by hand
# fires the normal push→main dev-slot deploy — the explicit deploy dispatch this
# job used to make is gone with the direct push.
#
# Two things GITHUB_TOKEN cannot do on its own, and how they are handled:
# - a PR it opens never fires `pull_request`, so CI is dispatched explicitly
#   on the branch (ci.yml has `workflow_dispatch` for exactly this);
# - opening a PR at all needs the repo setting "Allow GitHub Actions to create
#   and approve pull requests" (Settings → Actions → General).
#
# Required repo secrets (App-Service settings today, mirrored here by an
# admin): KATA_API_KEY, APIM_BASE_URL, APIM_SUBSCRIPTION_KEY.
name: Content nightly

on:
  schedule:
    - cron: "30 1 * * *"   # 04:30 Israel summer / 03:30 winter — after content editors, before school
  workflow_dispatch:
    inputs:
      max_browse:
        description: "Max lomdot to browse (catch-up runs can raise this)"
        required: false
        default: "10"
      max_llm_calls:
        description: "Max generation batches"
        required: false
        default: "40"
      dry_run:
        description: "Compute only — write and commit nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: content-nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Manim (in backend/requirements.txt) builds against Cairo/Pango — the
      # same block ci.yml installs.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run the pipeline
        env:
          KATA_API_KEY: ${{ secrets.KATA_API_KEY }}
          APIM_BASE_URL: ${{ secrets.APIM_BASE_URL }}
          APIM_SUBSCRIPTION_KEY: ${{ secrets.APIM_SUBSCRIPTION_KEY }}
          # Mongo-free by design: catalog over HTTP, usage events to the local
          # JSON fallback, and the database guard sees an explicit choice.
          SPARK_STORAGE: json
          SPARK_ENVIRONMENT: test
        run: |
          python backend/scripts/content_pipeline.py \
            --max-browse "${{ inputs.max_browse || '10' }}" \
            --max-llm-calls "${{ inputs.max_llm_calls || '40' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-pipeline-run
          path: backend/artifacts/content-pipeline/
          retention-days: 14
          if-no-files-found: ignore

      - name: Open (or update) the content pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: content/nightly
        run: |
          git config user.name "content-pipeline[bot]"
          git config user.email "content-pipeline@users.noreply.github.com"
          git add content/context
          if git diff --cached --quiet; then
            echo "catalog unchanged — nothing to propose"
            exit 0
          fi
          stamp="$(date -u +%F)"
          git commit -m "content: nightly context refresh ${stamp}"
          # Force, on purpose: the branch is rebuilt from tonight's main every
          # run, so an unmerged PR simply moves forward to the newest refresh.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          if [ -z "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "${BRANCH}" \
              --title "content: nightly context refresh ${stamp}" \
              --body "$(cat <<EOF
          Automated refresh of \`content/context/\` from the live Kata catalog by the content-nightly pipeline.

          Merging ships it to the dev slot through the normal push→main deploy. Nothing reaches production without the manual promote.

          If this PR sits unmerged, the next nightly run updates it in place rather than opening another.
          EOF
          )"
          fi

          # The checks the branch rule requires. A GITHUB_TOKEN-made PR does not
          # fire them, so ask for them on this exact commit.
          gh workflow run ci.yml --ref "${BRANCH}"
